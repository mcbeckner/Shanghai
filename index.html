<!DOCTYPE html>

        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 600px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        thead th { position: sticky; top: 0; background: #f4f4f4; z-index: 100; box-shadow: 0 2px 2px rgba(0,0,0,0.1); }
        .sticky-col { position: sticky; left: 0; background: #eee !important; font-weight: bold; z-index: 200; border-right: 2px solid #999; }
        .sh-cell { background: var(--warning) !important; color: white; }
        .low-score { background: #2ecc71 !important; color: white; }
        .high-score { background: #e74c3c !important; color: white; }
        .total-row { background: #e8e8e8; font-weight: bold; }
        .cut-row { background: #d1ecf1; font-size: 0.8em; }
        #keypadModal { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; padding: 10px; z-index: 2000; border-radius: 20px 20px 0 0; }
        #kpDisplay { color: white; font-size: 1.8em; text-align: center; margin-bottom: 8px; font-weight: bold; }
        .kp-container { display: flex; gap: 10px; }
        .kp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 2; }
        .kp-actions { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .kp-container button { padding: 15px 0; font-size: 1.4em; border-radius: 10px; border: none; background: white; font-weight: bold; }
        /* MODIFIED: Removed !important from background to allow JS inline style to work */
        .btn-sh { background: var(--warning); color: white; } 
        .btn-ent { background: var(--accent) !important; color: white; flex: 2; }
        .stat-best { background: rgba(46, 204, 113, 0.4) !important; font-weight: bold; }
        .stat-worst { background: rgba(231, 76, 60, 0.4) !important; font-weight: bold; }
        .clickable-header { text-decoration: underline; color: var(--blue); cursor: pointer; }
        .game-history-entry { background: white; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; padding: 15px; position: relative; }
        .delete-game-btn { position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; }
        
        .soundboard {
            position: fixed;
            left: 0;
            top: 48px;
            width: 100px;
            height: calc(100vh - 48px);
            background: #2c3e50;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            overflow-y: auto;
            z-index: 999;
            border-right: 1px solid #444;
        }
        .soundboard button {
            width: 100%;
            padding: 10px 5px;
            font-size: 0.75em;
            flex-shrink: 0;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #34495e;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
        }

        #gameView .table-wrap,
        #gameView #finalizeBtn {
            margin-left: 120px;
            width: calc(100% - 120px);
        }
        #gameView .table-wrap table {
            width: 100%;
            min-width: unset;
        }
    </style>
</head>

    function recalculateAllStats() {

            g.rounds.forEach(rd => { Object.keys(rd).forEach(p => { if(allPlayers.includes(p) && rd[p].isSH) { stats.playerData[p].shCount++; if(rd[p].score > stats.playerData[p].worstSHScore) stats.playerData[p].worstSHScore = rd[p].score; stats.historySH.push({name: p, score: rd[p].score, gameTimestamp: g.timestamp}); } }); });
            g.cutsData.forEach(c => { const cV = g.players.length * 11; c.playersAffected.forEach(pa => { if(pa.isCutter && allPlayers.includes(pa.player)) { stats.playerData[pa.player].cuts++; stats.cutBreakdown[cV] = (stats.cutBreakdown[cV] || 0) + 1; stats.playerData[pa.player].cutBreakdown[cV]++; } }); });
        });
    }
    async function loadStats(y) { const snap = await getDoc(doc(db, "shanghaiStats", y)); if (snap.exists()) { stats = snap.data(); if (!stats.fullGames) stats.fullGames = []; allPlayers.forEach(p => { if (stats.playerData[p] && !stats.playerData[p].cutBreakdown) stats.playerData[p].cutBreakdown = { 22:0, 33:0, 44:0, 55:0, 66:0, 77:0, 88:0 }; }); } else { stats = { playerData: allPlayers.reduce((acc, p) => { acc[p] = { wins: 0, losses: 0, shCount: 0, cuts: 0, worstSHScore: 0, lowWin: 999, highLoss: 0, maxWinStreak: 0, currentWinStreak: 0, maxLossStreak: 0, currentLossStreak: 0, cutBreakdown: { 22:0, 33:0, 44:0, 55:0, 66:0, 77:0, 88:0 } }; return acc; }, {}), historySH: [], historyWins: [], historyLosses: [], gameTimes: [], fullGames: [], cutBreakdown: { 22:0, 33:0, 44:0, 55:0, 66:0, 77:0, 88:0 } }; await setDoc(doc(db, "shanghaiStats", y), stats); } recalculateAllStats(); updateStatsDisplays(); }
    async function finalizeGame() { if (!confirm("Submit?")) return; const dur = Math.floor((Date.now() - startTime) / 1000); clearInterval(timerInterval); timerRunning = false; let dR = [], dC = []; for (let r = 1; r <= 7; r++) { let rd = {}; activePlayers.forEach((p, i) => { rd[p] = { score: parseInt(document.getElementById(`cell-${r}-${i}`).innerText) || 0, isSH: document.getElementById(`cell-${r}-${i}`).classList.contains('sh-cell') }; }); dR.push(rd); let row = document.getElementById(`row-score-${r}`), next = row.nextElementSibling; while (next && next.classList.contains('cut-row')) { let cd = { round: r, playersAffected: [] }; activePlayers.forEach((p, i) => { cd.playersAffected.push({ player: p, value: next.children[i + 1].innerText, isCutter: next.children[i + 1].getAttribute('data-cutter') !== "0" }); }); dC.push(cd); next = next.nextElementSibling; } } const scs = activePlayers.map((p, i) => ({ name: p, total: parseInt(document.getElementById(`total-7-${i}`).innerText) })); stats.fullGames.push({ timestamp: Date.now(), date: new Date().toLocaleString(), duration: dur, scores: scs, players: activePlayers, rounds: dR, cutsData: dC }); recalculateAllStats(); await setDoc(doc(db, "shanghaiStats", currentYear), stats); await loadStats(currentYear); showTab('stats'); }

    function updateStatsDisplays() { let wT = "No games", tT = "Total: 0"; if (stats.fullGames.length > 0) { tT = `Total: ${stats.fullGames.length}`; const last = stats.fullGames[stats.fullGames.length-1], w = [...last.scores].sort((a,b)=>a.total-b.total)[0]; wT = `Last Winner: ${w.name} (${w.total})`; } document.querySelectorAll('[id$="LastWinner"]').forEach(el => el.innerText = wT); document.querySelectorAll('[id$="TotalGames"]').forEach(el => el.innerText = tT); }
    function buildTable() { const h = document.getElementById('gameHead'), b = document.getElementById('gameBody'); h.innerHTML = `<tr><th class="sticky-col">Rnd</th>${activePlayers.map(p => `<th>${p}</th>`).join('')}</tr>`; b.innerHTML = ""; for (let r = 1; r <= 7; r++) { let rH = `<tr id="row-score-${r}"><td class="sticky-col">${r} <button onclick="openCutSelection(${r})">C</button></td>`; activePlayers.forEach((p, i) => { rH += `<td id="cell-${r}-${i}" onclick="openKeypad(${r},${i},'${p}')">0</td>`; }); rH += `</tr><tr id="row-total-${r}" class="total-row"><td class="sticky-col">TOT</td>`; activePlayers.forEach((p, i) => { rH += `<td id="total-${r}-${i}">0</td>`; }); rH += `</tr>`; b.innerHTML += rH; } }
    function calculate() { for (let r = 1; r <= 7; r++) { activePlayers.forEach((p, i) => { let s = parseInt(document.getElementById(`cell-${r}-${i}`).innerText) || 0, next = document.getElementById(`row-score-${r}`).nextElementSibling; while(next && next.classList.contains('cut-row')) { if(next.children[i+1].innerText === "50") s += 50; next = next.nextElementSibling; } let prev = r > 1 ? parseInt(document.getElementById(`total-${r-1}-${i}`).innerText) : 0; document.getElementById(`total-${r}-${i}`).innerText = s + prev; }); const tots = activePlayers.map((_, i) => parseInt(document.getElementById(`total-${r}-${i}`).innerText)), min = Math.min(...tots), max = Math.max(...tots); activePlayers.forEach((_, i) => { const el = document.getElementById(`total-${r}-${i}`), val = parseInt(el.innerText); el.className = (val === min) ? 'low-score' : (val === max) ? 'high-score' : ''; }); } }

        let h = `<table><thead><tr><th class="sticky-col">Player</th><th>Wins</th><th>Losses</th><th>W-Strk</th><th>L-Strk</th><th>SH</th><th id="shH" class="clickable-header">W-SH</th><th id="ctH" class="clickable-header">Cuts</th><th id="wnH" class="clickable-header">Lo-W</th><th id="lsH" class="clickable-header">Hi-L</th><th>Short/Long</th></tr></thead><tbody>`;
        allPlayers.forEach(p => { const d = pD[p], sT = stats.gameTimes.length ? Math.min(...stats.gameTimes.map(t=>t.time)) : 0, lT = stats.gameTimes.length ? Math.max(...stats.gameTimes.map(t=>t.time)) : 0;
            h += `<tr><td class="sticky-col">${p}</td><td class="${d.wins===mW && mW>0?'stat-best':''}">${d.wins}</td><td class="${d.losses===mL && mL>0?'stat-worst':''}">${d.losses}</td><td class="${d.maxWinStreak===mWS && mWS>1?'stat-best':''}">${d.maxWinStreak}</td><td class="${d.maxLossStreak===mLS && mLS>1?'stat-worst':''}">${d.maxLossStreak}</td>
            <td class="${d.shCount===mS && mS>0?'stat-worst':(d.shCount===minS?'stat-best':'')}">${d.shCount}</td>
            <td class="${d.worstSHScore === wS && wS > 0 ? 'stat-worst' : ''}">${d.worstSHScore}</td>
            <td class="p-cut clickable-header ${d.cuts===mC && mC>0?'stat-best':(d.cuts===minC?'stat-worst':'')}" data-p="${p}">${d.cuts}</td>
            <td class="${d.lowWin !== 999 && d.lowWin === bW ? 'stat-best' : ''}">${d.lowWin===999?'-':d.lowWin}</td>
            <td class="${d.highLoss === wL && wL > 0 ? 'stat-worst' : ''}">${d.highLoss}</td>
            <td>${Math.floor(sT/60)}m/${Math.floor(lT/60)}m</td></tr>`;
        }); cont.innerHTML = h + `</tbody></table>`;
        document.querySelectorAll('.p-cut').forEach(c => c.onclick = () => { const p=c.dataset.p, b=stats.playerData[p].cutBreakdown; openPopup(`${p}'s Cuts`, Object.keys(b).filter(k=>b[k]>0).map(k=>`${k}: ${b[k]}`)); });
        document.getElementById('shH').onclick = () => openPopup("SH Hist", [...stats.historySH].sort((a,b)=>b.score-a.score).map(i=>`${i.name}: ${i.score}`));
        document.getElementById('ctH').onclick = () => openPopup("Global Cuts", Object.keys(stats.cutBreakdown).filter(k=>stats.cutBreakdown[k]>0).map(k=>`${k}: ${stats.cutBreakdown[k]}`));
        document.getElementById('wnH').onclick = () => openPopup("Wins", [...stats.historyWins].sort((a,b)=>a.total-b.total).map(i=>`${i.name}: ${i.total}`));
        document.getElementById('lsH').onclick = () => openPopup("Losses", [...stats.historyLosses].sort((a,b)=>b.total-a.total).map(i=>`${i.name}: ${i.total}`));
    }
    function renderGameHistory() { const c = document.getElementById('historyContainer'), s = [...stats.fullGames].sort((a,b)=>b.timestamp-a.timestamp); c.innerHTML = s.map(g => { const sorted = [...g.scores].sort((a,b)=>a.total-b.total), win = sorted[0], los = sorted[sorted.length-1]; const sH = sorted.map(sc => `<div style="${sc.name===win.name?'color:var(--accent)':(sc.name===los.name?'color:var(--danger)':'')}">${sc.name}: ${sc.total}</div>`).join(''); return `<div class="game-history-entry"><button class="delete-game-btn" onclick="deleteGame(${g.timestamp})">X</button><div onclick='showGameDetails(${JSON.stringify(g)})'><strong>${g.date}</strong>${sH}</div></div>`; }).join(''); }
    window.showGameDetails = (g) => { document.getElementById('popupTitle').innerText = g.date; let t = `<table style="width:100%;border-collapse:collapse;"><tr><th>Rnd</th>${g.players.map(p=>`<th>${p}</th>`).join('')}</tr>`, tots = new Array(g.players.length).fill(0); g.rounds.forEach((rd, ri) => { t += `<tr><td>${ri+1}</td>${g.players.map((p, pi) => { tots[pi] += rd[p].score; return `<td class="${rd[p].isSH ? 'sh-cell':''}">${rd[p].score}</td>`; }).join('')}</tr>`; g.cutsData.filter(c => c.round === (ri+1)).forEach(cd => { t += `<tr style="background:#d1ecf1"><td>CUT</td>${g.players.map((p, pi) => { const pa = cd.playersAffected.find(x => x.player === p); if(pa.value === '50') tots[pi] += 50; return `<td>${pa.value}</td>`; }).join('')}</tr>`; }); t += `<tr style="font-weight:bold"><td>TOT</td>${tots.map(tt => `<td>${tt}</td>`).join('')}</tr>`; }); document.getElementById('popupContent').innerHTML = t + `</table>`; document.getElementById('overlay').classList.remove('hidden'); document.getElementById('detailPopup').classList.remove('hidden'); };
    function showTab(t) { document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active')); document.getElementById('nav'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active'); document.querySelectorAll('#gameView, #statsView, #historyView, #setupView, #seatingView').forEach(v => v.classList.add('hidden')); if(t === 'game') { if(timerRunning) document.getElementById('gameView').classList.remove('hidden'); else document.getElementById('setupView').classList.remove('hidden'); } else { document.getElementById(t+'View').classList.remove('hidden'); if(t==='stats') renderOverallStats(); if(t==='history') renderGameHistory(); } }
    document.getElementById('navGame').onclick = () => showTab('game'); document.getElementById('navStats').onclick = () => showTab('stats'); document.getElementById('navHistory').onclick = () => showTab('history');
    document.getElementById('startGameBtn').onclick = () => { let m = ""; activePlayers.forEach(p => { if (allPlayers.includes(p) && stats.playerData[p].currentWinStreak > 1) m += `${p.toUpperCase()} STREAK: ${stats.playerData[p].currentWinStreak}<br>`; }); if (m) { document.getElementById('streakText').innerHTML = m; document.getElementById('streakBanner').classList.remove('hidden'); window.sA = setInterval(playAlarm, 400); } else startActualGame(); };
    document.getElementById('dismissStreakBtn').onclick = () => { clearInterval(window.sA); document.getElementById('streakBanner').classList.add('hidden'); startActualGame(); };
    function startActualGame() { document.getElementById('setupView').classList.add('hidden'); document.getElementById('gameView').classList.remove('hidden'); document.getElementById('gameTimer').classList.remove('hidden'); startTime = Date.now(); timerRunning = true; buildTable(); timerInterval = setInterval(() => { const s = Math.floor((Date.now()-startTime)/1000); document.getElementById('gameTimer').innerText = `${Math.floor(s/60)}m ${s%60}s`; }, 1000); }
    document.getElementById('seatAssignBtn').onclick = () => { if (activePlayers.length < 2) return; for (let i = activePlayers.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [activePlayers[i], activePlayers[j]] = [activePlayers[j], activePlayers[i]]; } document.getElementById('seatingList').innerHTML = activePlayers.map((p, i) => `<li>Seat ${i+1}: ${p}</li>`).join(''); document.getElementById('setupView').classList.add('hidden'); document.getElementById('seatingView').classList.remove('hidden'); };
    document.getElementById('startGameFromSeatingBtn').onclick = () => document.getElementById('startGameBtn').click();
    document.getElementById('addGuestBtn').onclick = () => { const n = prompt("Name:"); if(n){ guestPlayers.push(n); activePlayers.push(n); initSetup(); } };
    document.getElementById('finalizeBtn').onclick = finalizeGame; document.getElementById('closePopupBtn').onclick = closePopups;
    document.getElementById('kpEnterBtn').onclick = () => { const c = document.getElementById(`cell-${activeCell.r}-${activeCell.i}`); c.innerText = kpVal || "0"; if(kpSh) c.classList.add('sh-cell'); else c.classList.remove('sh-cell'); document.getElementById('keypadModal').classList.add('hidden'); calculate(); };
    document.querySelectorAll('.kp-num').forEach(b => b.onclick = () => { kpVal += b.dataset.val; document.getElementById('kpDisplay').innerText = kpVal; });
    
    // MODIFIED: kpClearBtn now performs single-character backspace
    document.getElementById('kpClearBtn').onclick = () => { 
        kpVal = kpVal.slice(0, -1); // Remove the last character
        document.getElementById('kpDisplay').innerText = kpVal === "" ? "0" : kpVal; // Display 0 if empty
    };

    // This logic correctly sets the background color based on kpSh state (red if true, yellow if false)
    document.getElementById('kpShBtn').onclick = () => { kpSh = !kpSh; document.getElementById('kpShBtn').style.background = kpSh ? 'red' : 'var(--warning)'; };

    function closePopups() { document.getElementById('overlay').classList.add('hidden'); document.getElementById('detailPopup').classList.add('hidden'); }
    function openPopup(t, i) { document.getElementById('popupTitle').innerText = t; document.getElementById('popupContent').innerHTML = ''; document.getElementById('popupList').innerHTML = i.map(x => `<li>${x}</li>`).join(''); document.getElementById('overlay').classList.remove('hidden'); document.getElementById('detailPopup').classList.remove('hidden'); }
    function initSetup() { const c = document.getElementById('playerSelectContainer'); c.innerHTML = ''; allPlayers.forEach(p => { const d = document.createElement('div'); d.className = 'player-chip' + (activePlayers.includes(p)?' selected':''); d.innerText = p; d.onclick = () => { d.classList.toggle('selected'); if(activePlayers.includes(p)) activePlayers = activePlayers.filter(x=>x!==p); else activePlayers.push(p); }; c.appendChild(d); }); guestPlayers.forEach(p => { const d = document.createElement('div'); d.className = 'player-chip selected'; d.innerText = p + " (Guest)"; d.onclick = () => { guestPlayers = guestPlayers.filter(g=>g!==p); activePlayers = activePlayers.filter(a=>a!==p); initSetup(); }; c.appendChild(d); }); }
    
    window.addEventListener('keydown', (e) => { 
        const m = document.getElementById('keypadModal'); 
        // If keypad is NOT visible, check for soundboard shortcuts
        if (m.classList.contains('hidden')) {
            const soundButton = soundboardShortcuts[e.key.toLowerCase()];
            if (soundButton) {
                e.preventDefault(); // Prevent default browser actions for these keys
                soundButton.click(); // Trigger the click event on the sound button
            }
            return; // Exit if keypad is hidden and sound was handled or not relevant
        }
        
        // If keypad IS visible, handle keypad inputs
        if (e.key >= '0' && e.key <= '9') { 
            kpVal += e.key; 
            document.getElementById('kpDisplay').innerText = kpVal; 
        } else if (e.key.toLowerCase() === 's') { 
            e.preventDefault(); // Prevent default browser action (like search)
            document.getElementById('kpShBtn').click(); 
        } else if (e.key === 'Enter') { 
            e.preventDefault(); // Prevent form submission or other default actions
            document.getElementById('kpEnterBtn').click(); 
        } else if (e.key === 'Backspace') { 
            e.preventDefault(); // Prevent navigating back
            document.getElementById('kpClearBtn').click(); // Calls the now-modified single-backspace function
        } 
    });
    
    (async () => { window.deleteGame = deleteGame; const snp = await getDocs(collection(db, "shanghaiStats")); const ys = document.getElementById('yearSelect'); let yA = []; snp.forEach(d => yA.push(d.id)); if(!yA.includes(currentYear)) yA.push(currentYear); ys.innerHTML = yA.sort().reverse().map(y => `<option value="${y}">${y}</option>`).join(''); await loadStats(currentYear); initSetup(); showTab('stats'); })();
</script>
</body>
</html>
